<div class="lobby-container">
  <!-- Projects List Container -->
  <div class="section projects-container">
    <h2>Projects</h2>
    <div class="placeholder-box">
      <p>No projects yet (Placeholder)</p>
    </div>
  </div>

  <!-- Create Lobby Section -->
  <div class="section create-lobby-container">
    <h2>Create Lobby</h2>
    <div class="form-group">
      <label>Lobby Name:</label>
      <input type="text" [(ngModel)]="newRoomName" placeholder="Enter lobby name..." />
    </div>

    <div class="form-group">
      <label>Options (Placeholder):</label>
      <select>
        <option>Placeholder Option 1</option>
        <option>Placeholder Option 2</option>
      </select>
    </div>

    <button class="btn" (click)="createRoom()">Create</button>
  </div>
</div>
