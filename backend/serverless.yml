service: newtype-backend

provider:
  name: aws
  runtime: java17
  stage: dev
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
    LOBBIES_TABLE: ${self:service}-lobbies-${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - Fn::GetAtt: [ConnectionsTable, Arn]
            - Fn::GetAtt: [LobbiesTable, Arn]
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: "arn:aws:execute-api:*:*:*"

package:
  artifact: target/newtype-backend-1.0-SNAPSHOT.jar

functions:
  connectHandler:
    handler: com.newtype.WebSocketHandler::handleConnect
    events:
      - websocket:
          route: $connect

  disconnectHandler:
    handler: com.newtype.WebSocketHandler::handleDisconnect
    events:
      - websocket:
          route: $disconnect

  getLobbiesHandler:
    handler: com.newtype.LobbyHandler::getLobbies
    events:
      - websocket:
          route: getLobbies

  createLobbyHandler:
    handler: com.newtype.LobbyHandler::createLobby
    events:
      - websocket:
          route: createLobby

  joinLobbyHandler:
    handler: com.newtype.LobbyHandler::joinLobby
    events:
      - websocket:
          route: joinLobby

  closeLobbyHandler:
    handler: com.newtype.LobbyHandler::closeLobby
    events:
      - websocket:
          route: closeLobby

  sendSignalHandler:
    handler: com.newtype.SignalingHandler::sendSignal
    events:
      - websocket:
          route: sendSignal

resources:
  Resources:
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONNECTIONS_TABLE}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    LobbiesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.LOBBIES_TABLE}
        AttributeDefinitions:
          - AttributeName: roomId
            AttributeType: S
        KeySchema:
          - AttributeName: roomId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
